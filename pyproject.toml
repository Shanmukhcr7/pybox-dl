[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybox-dl"
version = "0.1.0"
description = "A production-ready Python library bundling 8 standalone Deep Learning programs with source inspection and export capabilities."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PyBox Maintainers" }
]
keywords = ["pybox", "pybox-dl", "deep-learning", "tensorflow", "neural-networks", "source-code", "exporter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Shanmukhcr7/pybox-dl"
Repository = "https://github.com/Shanmukhcr7/pybox-dl"
Issues = "https://github.com/Shanmukhcr7/pybox-dl/issues"
Changelog = "https://github.com/Shanmukhcr7/pybox-dl/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pybox_dl" = ["py.typed"]
"pybox_dl.programs" = ["*.py"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
